name: gnome-packagekit-to-trixie
method: apt
source:
  url: http://deb.debian.org/debian
  suite: bookworm
  components:
  - main
releases:
- trixie
architectures:
- armhf
- arm64
- amd64
target: desktop
install:
- gnome-packagekit
filter: Name (% gnome-packagekit*)
skip:
- trixie/armhf
notes: Built for bookworm. On trixie armhf it needs the library names before the 64-bit time_t transition.
