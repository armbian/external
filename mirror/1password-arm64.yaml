name: 1password-arm64
method: apt
# arm64 repository of 1password.yaml. 1Password publishes only the CLI for arm64.
source:
  url: https://downloads.1password.com/linux/debian/arm64
  suite: stable
  components:
  - main
releases: all
architectures:
- arm64
target: desktop
install:
- 1password-cli
filter: Name (= 1password-cli)
