name: zfs-noble
method: apt
source:
  url: https://ppa.launchpadcontent.net/arter97/zfs/ubuntu
  suite: noble
  components:
  - main
releases:
- noble
architectures:
- arm64
- amd64
target: utils
install:
- zfs-dkms
- zfsutils-linux
filter: Name (% zfsutils-linux) | Name (% libnvpair3linux) | Name (% libzfs7linux) | Name (% libzpool7linux) | Name (% libuutil3linux) | Name (% zfs-dkms) | Name (% zfs-zed)
