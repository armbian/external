name: winehq-staging-forky
method: apt
# Wine (staging), offered in the armbian-hyprland-shell Install menu. Debian
# forky has no wine. WineHQ builds amd64 only (WoW64, no i386 needed on forky).
# keys/winehq.gpg: D43F640145369C51D786DDEA76F1A20FF987672F.
source:
  url: https://dl.winehq.org/wine-builds/debian
  suite: forky
  components:
  - main
releases:
- forky
architectures:
- amd64
target: desktop
install:
- winehq-staging
filter: Name (= winehq-staging) | Name (= wine-staging) | Name (% wine-staging-*)
