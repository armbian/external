name: symfony-cli
method: apt
# Symfony CLI, offered in the armbian-hyprland-shell Install menu. Static Go
# binary: the forky suite serves forky and sid. keys/symfony.gpg:
# 50E6CC074455E44423B0494C99CEF8A62216B73D, as the Cloudsmith API lists.
source:
  url: https://dl.cloudsmith.io/public/symfony/stable/deb/debian
  suite: forky
  components:
  - main
releases:
- forky
- sid
architectures:
- amd64
- arm64
target: utils
install:
- symfony-cli
filter: Name (= symfony-cli)
