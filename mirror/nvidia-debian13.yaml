name: nvidia-debian13
method: apt
# NVIDIA driver (open kernel modules), latest branch, from the NVIDIA CUDA
# repository. Flat repository, one for each architecture. keys/nvidia-cuda-
# debian13.gpg holds the vendor file 8793F200.pub; fingerprint
# 02182E60...8793F200 is the same on keyserver.ubuntu.com. NVIDIA has no
# Debian 14 repository: forky uses the Debian 13 packages.
source:
  url: https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64
  suite: ./
releases:
- trixie
- forky
architectures:
- amd64
target: utils
install:
- nvidia-open
filter: Name (= nvidia-open)
with_deps: true
# The release dkms is new enough (>= 3.1.8). Do not replace it.
exclude:
- dkms
