name: code
method: apt
source:
  url: https://packages.microsoft.com/repos/code
  suite: stable
  components:
  - main
releases:
- noble
- resolute
- bookworm
- trixie
- forky
architectures:
- armhf
- arm64
- amd64
target: desktop
install:
- code
filter: Name (% code)
skip:
- noble/armhf
- resolute/armhf
- trixie/armhf
- forky/armhf
notes: 'armhf: upstream builds against the library names before the 64-bit time_t transition (libasound2, not libasound2t64).'
