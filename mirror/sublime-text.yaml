name: sublime-text
method: apt
# Sublime Text 4, offered in the armbian-hyprland-shell Install menu. Flat
# repository; it also holds Sublime Merge. keys/sublimehq.gpg holds the
# vendor key file; the primary 1EDDE2CD...8A8F901A matches the vendor docs.
source:
  url: https://download.sublimetext.com
  suite: apt/stable/
releases: all
architectures:
- amd64
- arm64
target: desktop
install:
- sublime-text
filter: Name (= sublime-text)
