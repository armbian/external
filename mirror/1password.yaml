name: 1password
method: apt
# 1Password desktop app and CLI, offered in the armbian-hyprland-shell
# Install menu. Key: 1Password docs give the fingerprint
# 3FEF9748469ADBE15DA7CA80AC2D62742012EA22 (keys/1password.gpg).
# Each architecture is a separate repository. The arm64 one is in
# 1password-arm64.yaml: it has the CLI only.
source:
  url: https://downloads.1password.com/linux/debian/amd64
  suite: stable
  components:
  - main
releases: all
architectures:
- amd64
target: desktop
install:
- 1password
- 1password-cli
filter: Name (= 1password) | Name (= 1password-cli)
