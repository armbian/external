name: zfs-resolute
method: apt
source:
  url: https://ppa.launchpadcontent.net/arter97/zfs/ubuntu
  suite: resolute
  components:
  - main
releases:
- resolute
architectures:
- arm64
- amd64
target: utils
install:
- zfs-dkms
- zfsutils-linux
filter: Name (% zfsutils-linux) | Name (% libnvpair3linux) | Name (% libzfs7linux) | Name (% libzpool7linux) | Name (% libuutil3linux) | Name (% zfs-dkms) | Name (% zfs-zed)
skip:
- resolute/arm64
notes: 'resolute arm64: the PPA build needs python3-distutils, which resolute does not have.'
