name: hype
method: build
# Omarchy app (MIT), part of the armbian-hyprland-shell desktop. Local
# packaging in build/hype/debian/, after the upstream Arch PKGBUILD
# (omacom/omarchy-pkgs, pkgbuilds/hype).
upstream:
  url: https://github.com/omacom/hype
  ref: v0.6.0
releases:
- forky
- sid
architectures:
- amd64
- arm64
target: desktop
install:
- hype
