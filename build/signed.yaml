name: signed
method: build
# Omarchy app (MIT), part of the armbian-hyprland-shell desktop. Local
# packaging in build/signed/debian/, after the upstream Arch PKGBUILD
# (omacom/omarchy-pkgs, pkgbuilds/signed).
upstream:
  url: https://github.com/omacom/signed
  ref: v0.3.1
releases:
- forky
- sid
architectures:
- amd64
- arm64
target: desktop
install:
- signed
