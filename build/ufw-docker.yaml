name: ufw-docker
method: build
# ufw rules for Docker containers (GPL-3.0), part of the
# armbian-hyprland-shell desktop. Local packaging in build/ufw-docker/debian/.
upstream:
  url: https://github.com/chaifeng/ufw-docker
  ref: '251123'
releases:
- forky
- sid
architectures:
- amd64
- arm64
target: desktop
install:
- ufw-docker
