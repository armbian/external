name: armbian-netbird
method: build
# NetBird mesh VPN client (BSD-3-Clause). Repacks the upstream release binary
# with a systemd unit. The upstream package installs its service from
# postinst: in an image build chroot it writes a SysV script and starts the
# daemon. Local packaging in build/armbian-netbird/debian/.
upstream:
  url: https://github.com/netbirdio/netbird
releases: all
architectures:
- amd64
- arm64
target: utils
install:
- armbian-netbird
