name: armbian-snapshots
method: build
# Snapshots of a btrfs root before and after updates, made with snapper, for
# all images (CLI and desktop). GRUB boot entries for the snapshots and a
# restore command. It does nothing on other root file systems. Local source
# and packaging in build/armbian-snapshots/. armbian-hyprland-shell had these
# files before.
version: 1.0.0
releases: all
# utils: CLI images have it too.
target: utils
architectures:
- amd64
- arm64
- riscv64
install:
- armbian-snapshots
