name: fastfetch
method: build
# Debian packaging on the newest upstream release.
# Patch: bundled yyjson. Not built: bookworm (no C23 compiler), armhf (no native runner).
packaging:
  url: https://deb.debian.org/debian
  suite: sid
  components: [main]
  package: fastfetch
revision: 2
upstream:
  url: https://github.com/fastfetch-cli/fastfetch
releases: all
architectures:
- arm64
- amd64
target: utils
install:
- fastfetch
skip:
- bookworm/arm64
- bookworm/amd64
