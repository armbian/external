# Armbian first-run wizard. Remove the "#" to set a value.

# Background image: PNG, JPEG or SVG. Default: an Armbian gradient.
#BACKGROUND=/usr/share/backgrounds/armbian/armbian-default.png

# Font: a font file, or a font family name. Default: DejaVu Sans.
#FONT=/usr/share/fonts/truetype/noto/NotoSans-Regular.ttf

# Logo in the header: PNG, JPEG or SVG, for a dark background. Default: the Armbian logo.
#LOGO=/usr/share/pixmaps/armbian-logo-text-dark.svg

# Text in the header in place of the logo.
#TITLE=Armbian

# Accent color. Default: Armbian orange of armbian.com.
#ACCENT=#f26522
