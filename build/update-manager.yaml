name: update-manager
method: build
# Software Updater for Armbian, from Ubuntu's resolute packaging, on all releases.
# Debian has no update-manager.
# Patches: no Ubuntu Pro, Livepatch, OEM, HWE or snap. Release upgrades with armbian-config.
# Debian changelogs and security updates. Debian needs python3-distupgrade (ubuntu-release-upgrader).
packaging:
  url: http://archive.ubuntu.com/ubuntu
  suite: resolute
  components: [main]
  package: update-manager
releases:
- resolute
- noble
- jammy
- bookworm
- trixie
- forky
- sid
architectures:
- amd64
- arm64
target: desktop
repositories:
- beta
install:
- update-manager
