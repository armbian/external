name: update-manager
method: build
# Software Updater for Armbian, from Ubuntu's resolute packaging, on all releases.
# Debian has no update-manager.
# Patches: no Ubuntu Pro, Livepatch, OEM, HWE or snap. Release upgrades with armbian-config.
# armbian-update-notifier: a notification for updates and a pending restart.
# Debian changelogs and security updates.
# A hicolor icon: Numix (Xfce) has no system-software-update.
# Debian needs python3-distupgrade (ubuntu-release-upgrader) and aptdaemon (aptdaemon, python-defer).
packaging:
  url: http://archive.ubuntu.com/ubuntu
  suite: resolute
  components: [main]
  package: update-manager
revision: 3
releases:
- resolute
- noble
- jammy
- bookworm
- trixie
- forky
- sid
architectures:
- amd64
- arm64
target: desktop
install:
- update-manager
