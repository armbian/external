name: gh-riscv64
method: build
# GitHub CLI for riscv64, built from source on a native riscv64 runner.
# Upstream releases have no riscv64 build, and Debian forky has no gh.
# The other architectures come from mirror/gh.yaml.
# Local packaging in build/gh-riscv64/debian/.
# No jammy: the riscv64 runner's node24 needs glibc 2.38.
# Jammy has gh in Ubuntu universe.
# No resolute: its riscv64 userland needs RVA23. The runner CPUs lack it.
upstream:
  url: https://github.com/cli/cli
releases:
- noble
- trixie
- forky
- sid
architectures:
- riscv64
target: utils
install:
- gh
