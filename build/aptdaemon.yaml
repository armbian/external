name: aptdaemon
method: build
# aptdaemon on Debian, so update-manager installs updates the same way on all releases.
# Debian dropped aptdaemon after jessie. Ubuntu releases use their own package.
packaging:
  url: http://archive.ubuntu.com/ubuntu
  suite: resolute
  components: [main]
  package: aptdaemon
build_depends:
- python-defer
revision: 2
releases:
- bookworm
- trixie
- forky
- sid
architectures:
- amd64
- arm64
target: desktop
install:
- python3-aptdaemon.gtk3widgets
