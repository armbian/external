name: update-manager-jammy
method: build
# Software Updater for Armbian on jammy, from jammy's own packaging.
# Same changes as update-manager. jammy keeps its python3-distupgrade.
packaging:
  url: http://archive.ubuntu.com/ubuntu
  suite: jammy-updates
  components: [main]
  package: update-manager
releases:
- jammy
architectures:
- amd64
- arm64
target: desktop
repositories:
- beta
install:
- update-manager
