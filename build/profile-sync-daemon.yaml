name: profile-sync-daemon
method: build
# Debian packaging on the newest upstream release. The distributions ship 6.34 to 7.04.
# Before 7.02, psd-resync.service stops the profile overlays before psd.service copies back
# (configng#1072). 8.0 also fixes crash recovery (graysky2/profile-sync-daemon#438).
# Patch: debhelper compat 13, for older debhelper.
# Patch: skip Chromium and Chrome when not installed. Omarchy creates their config
# directories for its extension hosts, and psd synced them.
# Not trixie: 6.50 is not affected, and 8.0 cannot take over a running 6.x session.
# resolute: needs the user@ stop timeout from armbian/configng#1103.
packaging:
  url: https://deb.debian.org/debian
  suite: sid
  components: [main]
  package: profile-sync-daemon
upstream:
  url: https://github.com/graysky2/profile-sync-daemon
# Patches changed without a new upstream release.
revision: 2
releases:
- forky
- resolute
architectures:
- amd64
- arm64
target: desktop
install:
- profile-sync-daemon
