name: armbian-firstrun-gui
method: build
# Armbian first-run wizard (GPL-3.0): graphical setup on the screen at the
# first boot. It writes presets for armbian-firstlogin. Local source and
# packaging in build/armbian-firstrun-gui/. Keyboard presets: armbian/build#11350.
# Rust 1.85 or newer: not bookworm and jammy. noble uses rustc-1.85.
version: 0.1.1
releases:
- trixie
- forky
- sid
- noble
- resolute
architectures:
- amd64
- arm64
- riscv64
target: utils
install:
- armbian-firstrun-gui
