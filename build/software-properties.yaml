name: software-properties
method: build
# Software & Updates (software-properties-gtk), from Ubuntu's resolute packaging.
# update-manager opens it for the settings. Debian trixie, forky and sid have
# no GTK frontend: Debian's needs libhandy. Bookworm and jammy keep their own.
# Patches: no Ubuntu Pro. Debian support: no drivers tab, no dh-translations.
packaging:
  url: http://archive.ubuntu.com/ubuntu
  suite: resolute-updates
  components: [main]
  package: software-properties
revision: 2
releases:
- resolute
- noble
- trixie
- forky
- sid
architectures:
- amd64
- arm64
target: desktop
install:
- software-properties-gtk
