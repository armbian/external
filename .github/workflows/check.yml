name: "Check"

# Pull requests: unit tests, config validation, a plan of every package, and a
# dry-run download of the changed package configs. Nothing is uploaded.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 60
    env:
      ARMBIAN_BUILD_DIR: ${{ github.workspace }}/build
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Runner clean (self-hosted runner)
        if: runner.environment != 'github-hosted'
        uses: armbian/actions/runner-clean@main

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout armbian/build (supported releases only)
        uses: actions/checkout@v7
        with:
          repository: armbian/build
          path: build
          sparse-checkout: config/distributions

      - name: Install missing tools
        run: |
          need=()
          for t in gpgv:gpgv dpkg-deb:dpkg fakeroot:fakeroot apt-get:apt; do
            command -v "${t%%:*}" >/dev/null || need+=("${t##*:}")
          done
          # Archive keys for the dependency check.
          [ -f /usr/share/keyrings/debian-archive-keyring.gpg ] || need+=(debian-archive-keyring)
          [ -f /usr/share/keyrings/ubuntu-archive-keyring.gpg ] || need+=(ubuntu-keyring)
          python3 -c 'import yaml' 2>/dev/null || need+=(python3-yaml)
          if [ ${#need[@]} -gt 0 ]; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends "${need[@]}"
          fi

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: Validate package configs
        run: python3 -m extpkg validate

      - name: Plan every package
        run: python3 -m extpkg plan --jobs 16 --out plan.json

      - name: Changed package configs
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          names=""
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then
            names=$(git diff --name-only "$base" HEAD -- 'packages/*.yaml' \
              | xargs -r -n1 basename | sed 's/\.yaml$//' \
              | while read -r n; do [ -f "packages/$n.yaml" ] && echo "$n"; done | paste -sd, -)
          fi
          count=$(printf '%s' "$names" | tr ',' '\n' | grep -c . || true)
          echo "Changed package configs (${count}): ${names:-none}"
          # A download of many configs belongs in the Sync workflow (dry run).
          if [ "$count" -gt 8 ]; then
            echo "::notice::${count} configs changed: plan only. Run 'Sync external packages' with dry_run for a download test."
            names=""
          fi
          echo "names=${names}" >> "$GITHUB_OUTPUT"

      - name: Restore apt index lists
        if: steps.changed.outputs.names != ''
        uses: actions/cache/restore@v6
        with:
          path: .cache/apt-lists
          key: depcheck-lists-${{ github.run_id }}
          restore-keys: depcheck-lists-

      - name: Dry-run download and dependency check of changed configs
        if: steps.changed.outputs.names != ''
        # Fails on a failed download, check or dependency: the PR must not merge.
        run: |
          python3 -m extpkg run --dry-run --strict --depcheck --jobs 12 \
            --only "${{ steps.changed.outputs.names }}" --out output --cache "${RUNNER_TEMP}/cache" \
            --lists-cache .cache/apt-lists

      - name: Keep plan and manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check
          path: |
            plan.json
            output/manifest.json
          if-no-files-found: ignore
          retention-days: 7
